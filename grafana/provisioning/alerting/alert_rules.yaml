apiVersion: 1
groups:
  - orgId: 1
    name: 'Condiciones Extremas'
    folder: 'Alertas Deporte'
    interval: 5m
    rules:
      - uid: 'iad_aviso'
        title: 'IAD < 7 (Precaución)'
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: 'timescaledb'
            model:
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT CASE coord_index WHEN 0 THEN 'A Coruña' WHEN 1 THEN 'Santiago' WHEN 2 THEN 'Vigo' WHEN 3 THEN 'Lugo' WHEN 4 THEN 'Ourense' WHEN 5 THEN 'Pontevedra' END as zona, score FROM (SELECT DISTINCT ON (coord_index) coord_index, score FROM meteogalicia.iad_running WHERE time >= NOW() ORDER BY coord_index, time ASC, ts_ingested DESC) s"
              refId: A
          - refId: B
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params: [7.0]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "El clima ya no está tan bueno para correr"
          description: "El IAD ha bajado a {{ $values.B.Value }} / 10."
        labels:
          severity: warning
      - uid: 'aqi_mala'
        title: 'Calidad del aire MALA (AQI > 50)'
        condition: B
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: 'timescaledb'
            model:
              editorMode: code
              format: table
              rawQuery: true
              rawSql: "SELECT CASE coord_index WHEN 0 THEN 'A Coruña' WHEN 1 THEN 'Santiago' WHEN 2 THEN 'Vigo' WHEN 3 THEN 'Lugo' WHEN 4 THEN 'Ourense' WHEN 5 THEN 'Pontevedra' END as zona, european_aqi FROM (SELECT DISTINCT ON (coord_index) coord_index, european_aqi FROM raw_air.quality WHERE time >= NOW() - INTERVAL '1 hour' ORDER BY coord_index, time DESC, ts_ingested DESC) s"
              refId: A
          - refId: B
            datasourceUid: '-100'
            model:
              conditions:
                - evaluator:
                    params: [50.0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "Se desaconseja el ejercicio intenso al aire libre"
          description: "El AQI en tu zona es de {{ $values.B.Value }} (> 50)."
        labels:
          severity: critical
