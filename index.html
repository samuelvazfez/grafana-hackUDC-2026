<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Integración Web - IAD Galicia</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1b26;
            color: #a9b1d6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: #24283b;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            color: #7aa2f7;
            font-size: 2.5rem;
        }

        .container {
            width: 95%;
            max-width: 1600px;
            background: #24283b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .iframe-wrapper {
            width: 100%;
            height: 85vh;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #414868;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #565f89;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Galicia Deporte Seguro</h1>
    </header>

    <div class="container">
        <p>Esta es tu página web personalizada. El panel de abajo está incrustado directamente desde Grafana.</p>

        <div class="iframe-wrapper">
            <!-- 
                kiosk=tv oculta el menú lateral y superior de Grafana
                theme=dark fuerza el tema oscuro
            -->
            <iframe src="http://localhost:3000/d/iad-deportes-galicia/iad-deportes-galicia?orgId=1&kiosk=tv&theme=dark" 
                    title="Dashboard IAD Deportes Galicia">
            </iframe>
        </div>

        <p class="info">Demostración técnica para HackUDC 2026. Los datos provienen de MeteoSIX y se procesan a tiempo real.</p>
    </div>

</body>
</html>
